<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大鵬灣實境解謎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #102b35;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .tag {
      color: #b6d8d5;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: 32px;
      margin: 22px 0 12px;
    }

    .description {
      color: #d0dddf;
      line-height: 1.8;
      font-size: 15px;
    }

    .panel {
      margin-top: 32px;
      padding: 28px 20px;
      border: 1px solid #54717a;
      border-radius: 16px;
      background: #193b46;
    }

    .status {
      color: #d9e8e8;
      font-size: 14px;
    }

    .start-button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #d0b27b;
      color: #172e35;
      font-size: 17px;
      font-weight: bold;
    }

    .note {
      margin-top: 28px;
      color: #9eb5ba;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="tag">DAPPENG BAY · QR MYSTERY GAME</div>

    <h1>大鵬灣實境解謎</h1>

    <p class="description">
      一場結合在地故事、場景探索與邏輯推理的冒險。<br>
      探索五個任務據點，解開隱藏在大鵬灣的秘密。
    </p>

    <section class="panel">

      <p class="status">GAME SYSTEM</p>

      <h2>冒險即將開始</h2>

      <p class="description">
        請準備好手機，開啟定位功能，<br>
        跟隨線索完成每一道挑戰。
      </p>

      <button class="start-button" type="button">
        即將開放
      </button>

    </section>

    <p class="note">
      DAPPENG BAY · FIVE CHECKPOINTS
    </p>

  </main>
</body>
</html>

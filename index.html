<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大鵬灣實境解謎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #102b35;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .tag {
      color: #b6d8d5;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: 32px;
      margin: 22px 0 12px;
    }

    .description {
      color: #d0dddf;
      line-height: 1.8;
      font-size: 15px;
    }

    .panel {
      margin-top: 32px;
      padding: 28px 20px;
      border: 1px solid #54717a;
      border-radius: 16px;
      background: #193b46;
    }

    .status {
      color: #d9e8e8;
      font-size: 14px;
    }

    .start-button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #d0b27b;
      color: #172e35;
      font-size: 17px;
      font-weight: bold;
    }

    .note {
      margin-top: 28px;
      color: #9eb5ba;
      font-size: 12px;
    }
  </style>
</head>
 
<script>
  // 保留你原本的 Apps Script /exec 網址
  const API_URL = 'https://script.google.com/macros/s/AKfycbwBSBSb11DZzirmff-DNdhGFw0t4ER_R7lmQAz2bAF61LjmOrMU2HEfKIPpOxb6hYJknA/exec';

  // 取得網址中的關卡編號
  const params = new URLSearchParams(window.location.search);
  const stageId = params.get('stage_id');

  function showStatus(message) {
    const status = document.getElementById('api-status');
    if (status) {
      status.textContent = message;
    }
  }

  // 避免外部網址或不安全內容被當成圖片載入
  function safeImageUrl(value) {
    try {
      const url = new URL(value);
      if (url.protocol === 'https:' || url.protocol === 'http:') {
        return url.href;
      }
    } catch (error) {
      // 無效網址不顯示圖片
    }
    return '';
  }

  // 避免試算表內容被當成 HTML 程式執行
  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, function(char) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char];
    });
  }

  function loadGameData() {
    const list = document.getElementById('stage-list');

    if (!stageId || !/^[1-9]\d*$/.test(stageId)) {
      showStatus('請使用正確的關卡網址進入遊戲。');
      if (list) {
        list.innerHTML = '<p>網址中缺少有效的關卡編號。</p>';
      }
      return;
    }

    showStatus('正在載入第 ' + stageId + ' 關...');

    const callbackName = 'gameCallback';

    window[callbackName] = function(data) {
      delete window[callbackName];

      if (!data || !data.success || !data.stage) {
        showStatus('無法讀取此關卡。');
        list.innerHTML = '<p>此關卡不存在或尚未開放。</p>';
        return;
      }

      const stage = data.stage;

      showStatus('第 ' + escapeHTML(stage.stage_id) + ' 關載入成功！');

      const taskType = stage.task_type === 'photo'
        ? '拍照任務'
        : '解謎任務';

      const imageUrl = safeImageUrl(stage.image_url);

      list.innerHTML = `
        <div style="
          padding:18px;
          margin:12px 0;
          border:1px solid #54717a;
          border-radius:12px;
          text-align:left;
          background:rgba(255,255,255,0.05);
        ">
          <p style="color:#9bc5c8;">
            ${taskType}
          </p>

          <h2>${escapeHTML(stage.title)}</h2>

          <p>${escapeHTML(stage.story)}</p>

          ${imageUrl ? `
            <img
              src="${escapeHTML(imageUrl)}"
              alt="關卡圖片"
              style="width:100%;border-radius:8px;margin:12px 0;"
            >
          ` : ''}

          <hr style="border-color:#54717a;">

          <h3>本關任務</h3>
          <p>${escapeHTML(stage.question)}</p>

          <details style="margin-top:16px;">
            <summary>查看提示</summary>
            <p>${escapeHTML(stage.hint)}</p>
          </details>
        <hr style="border-color:#54717a;margin-top:20px;">

<h3>提交答案</h3>

<form
  id="answer-form"
  action="${API_URL}"
  method="POST"
  target="dpp-answer-frame"
>
  <input
    type="hidden"
    name="stage_id"
    value="${escapeHTML(stage.stage_id)}"
  >

  <input
    type="text"
    name="answer"
    id="player-answer"
    placeholder="請輸入你的答案"
    maxlength="200"
    required
    style="
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border-radius:8px;
      border:1px solid #54717a;
      margin:10px 0;
      font-size:16px;
    "
  >

  <button
    type="submit"
    id="answer-submit"
    style="
      width:100%;
      padding:12px;
      border:0;
      border-radius:8px;
      background:#4b9295;
      color:white;
      font-size:16px;
      cursor:pointer;
    "
  >
    送出答案
  </button>
</form>

<iframe
  name="dpp-answer-frame"
  id="dpp-answer-frame"
  style="display:none;"
></iframe>

<p id="answer-result" aria-live="polite"></p></div>
      `;
    };

    const script = document.createElement('script');

    script.src =
      API_URL +
      '?stage_id=' + encodeURIComponent(stageId) +
      '&callback=' + callbackName +
      '&t=' + Date.now();

    script.onerror = function() {
      delete window[callbackName];
      showStatus('無法連接遊戲資料庫，請稍後再試。');
    };

    document.body.appendChild(script);
  }


window.addEventListener('message', function(event) {
  const iframe = document.getElementById('dpp-answer-frame');

  if (!iframe || event.source !== iframe.contentWindow) return;

  const message = event.data;

  if (!message || message.type !== 'DPP_ANSWER_SUBMITTED') return;

  const requestId = message.requestId;

  if (!requestId) return;

  checkAnswerResult(requestId);
});


document.addEventListener('submit', function(event) {

  if (event.target.id !== 'answer-form') {
    return;
  }

  const button = document.getElementById('answer-submit');
  const resultBox = document.getElementById('answer-result');

  if (button) {
    button.disabled = true;
    button.textContent = '正在驗證...';
  }

  if (resultBox) {
    resultBox.textContent = '正在檢查你的答案...';
  }

}, true);

function checkAnswerResult(requestId) {
  const resultBox = document.getElementById('answer-result');
  const submitButton = document.getElementById('answer-submit');

  if (!resultBox) return;

  resultBox.textContent = '正在檢查你的答案...';

  let attempts = 0;
  const maxAttempts = 15;

  function queryResult() {
    attempts++;

    const callbackName = 'answerResultCallback';

    window[callbackName] = function(result) {
      delete window[callbackName];

      if (result && result.pending) {
        if (attempts < maxAttempts) {
          setTimeout(queryResult, 1000);
        } else {
          resultBox.textContent = '驗證逾時，請重新提交。';
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = '送出答案';
          }
        }
        return;
      }

      if (result && result.success && result.correct) {
        resultBox.textContent = '🎉 答對了！' + result.message;
        resultBox.style.color = '#7ee0a1';
      } else {
        resultBox.textContent = result && result.message
          ? result.message
          : '驗證失敗，請重新提交。';
        resultBox.style.color = '#ffb0a0';
      }

      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent = '送出答案';
      }
    };

    const script = document.createElement('script');

    script.src = API_URL
      + '?request_id=' + encodeURIComponent(requestId)
      + '&callback=' + callbackName
      + '&t=' + Date.now();

    script.onerror = function() {
      delete window[callbackName];

      if (attempts < maxAttempts) {
        setTimeout(queryResult, 1000);
      } else {
        resultBox.textContent = '無法取得驗證結果，請重新提交。';
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = '送出答案';
        }
      }
    };

    document.body.appendChild(script);
  }

  queryResult();
}

window.addEventListener('load', loadGameData);
</script>

  <body>
  <main class="container">

    <div class="tag">DAPPENG BAY · QR MYSTERY GAME</div>

    <h1>大鵬灣實境解謎</h1>

    <p class="description">
      一場結合在地故事、場景探索與邏輯推理的冒險。<br>
      探索五個任務據點，解開隱藏在大鵬灣的秘密。
    </p>

    <section class="panel">

      <p class="status" id="api-status">
  正在連接遊戲資料庫...
</p>

      <h2>冒險即將開始</h2>

      <p class="description">
        請準備好手機，開啟定位功能，<br>
        跟隨線索完成每一道挑戰。
      </p>
<div id="stage-list"></div>
      <button class="start-button" type="button">
        即將開放
      </button>

    </section>

    <p class="note">
      DAPPENG BAY · FIVE CHECKPOINTS
    </p>

  </main>
</body>
</html>
